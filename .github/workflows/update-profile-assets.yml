name: Update Profile Assets

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install converters
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin imagemagick

      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: lumen-jsy
          outputs: |
            assets/generated/snake.svg
            assets/generated/snake.gif?palette=github-dark

      - name: Download stats cards
        run: |
          mkdir -p assets/generated
          curl -fsSL -o assets/generated/stats.svg \
            "https://github-readme-stats.vercel.app/api?username=achieve-jsy&show_icons=true&theme=tokyonight&hide_border=true&include_all_commits=true&count_private=true"
          curl -fsSL -o assets/generated/top-langs.svg \
            "https://github-readme-stats.vercel.app/api/top-langs/?username=achieve-jsy&layout=compact&theme=tokyonight&hide_border=true&langs_count=8"
          curl -fsSL -o assets/generated/streak.svg \
            "https://streak-stats.demolab.com/?user=lumen-jsy&theme=tokyonight&hide_border=true"
          curl -fsSL -o assets/generated/activity.svg \
            "https://github-readme-activity-graph.vercel.app/graph?username=achieve-jsy&theme=tokyo-night&hide_border=true&area=true&height=200"

      - name: Convert SVG to PNG for GitHub compatibility
        run: |
          rsvg-convert -w 480 assets/generated/stats.svg -o assets/generated/stats.png
          rsvg-convert -w 360 assets/generated/top-langs.svg -o assets/generated/top-langs.png
          rsvg-convert -w 520 assets/generated/streak.svg -o assets/generated/streak.png
          rsvg-convert -w 900 assets/generated/activity.svg -o assets/generated/activity.png
          rsvg-convert -w 900 assets/banner.svg -o assets/generated/banner.png
          ls -la assets/generated/*.{png,gif} 2>/dev/null || ls -la assets/generated/

      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/generated/
          git diff --staged --quiet || git commit -m "chore: refresh profile visualization assets"
          git push
