  </defs>
  <rect width="1200" height="220" fill="url(#bg)"/>
  <rect width="1200" height="220" fill="url(#dots)"/>
  <rect x="80" y="108" width="180" height="4" rx="2" fill="url(#accent)"/>
  <text x="80" y="88" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="56" font-weight="700">Lumen</text>
  <text x="80" y="150" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="22">Developer / Backend / Systems</text>
  <text x="80" y="182" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="16">Build with clarity. Ship with care.</text>
